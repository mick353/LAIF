<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title"><title id="title">From a local document to source-grounded analysis and an actionable review pack</title><rect x="0" y="0" width="1600" height="460" rx="20" fill="#f5f4ee"/><text x="55" y="67" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#526b73" letter-spacing="2">A REVIEW WORKFLOW. CLEAR OUTPUTS.</text><rect x="55" y="110" width="436" height="278" rx="12" fill="#ffffff" stroke="#d4ddda"/><text x="83" y="161" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#23775d" >01</text><text x="83" y="222" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#101f2d" >Bring a document</text><text x="83" y="275" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >Policy, standard, procedure</text><text x="83" y="309" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >or supplier submission.</text><path d="M83 344H460" stroke="#c9e7da" stroke-width="4"/><rect x="582" y="110" width="436" height="278" rx="12" fill="#ffffff" stroke="#d4ddda"/><text x="610" y="161" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#23775d" >02</text><text x="610" y="222" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#101f2d" >Inspect the structure</text><text x="610" y="275" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >Responsibilities, source evidence,</text><text x="610" y="309" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >gaps and failure pathways.</text><path d="M610 344H987" stroke="#c9e7da" stroke-width="4"/><rect x="1109" y="110" width="436" height="278" rx="12" fill="#ffffff" stroke="#d4ddda"/><text x="1137" y="161" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#23775d" >03</text><text x="1137" y="222" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#101f2d" >Plan the next action</text><text x="1137" y="275" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >Assessment, quote bank,</text><text x="1137" y="309" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52636b" >gap register and controls.</text><path d="M1137 344H1514" stroke="#c9e7da" stroke-width="4"/><path d="M514 247h39m-12-12 12 12-12 12" fill="none" stroke="#477c68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1041 247h39m-12-12 12 12-12 12" fill="none" stroke="#477c68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="430" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52636b" >Local processing • Human review • Explicit limits</text></svg>