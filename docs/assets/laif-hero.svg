<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">LAIF — Turn AI policy promises into controls you can inspect</title><rect x="0" y="0" width="1600" height="700" rx="24" fill="#101f2d"/><rect x="72" y="69" width="9" height="48" rx="2" fill="#83e6c3"/><text x="101" y="109" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" fill="#f5f4ee" >LAIF</text><text x="73" y="159" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#aebfc7" letter-spacing="2.2">LAW-ALIGNED INTELLIGENCE FRAMEWORK</text><text x="72" y="266" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#f5f4ee" >Turn AI policy</text><text x="72" y="344" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#f5f4ee" >promises into controls</text><text x="72" y="422" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#83e6c3" >you can inspect.</text><text x="75" y="488" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#aebfc7" >Find the missing machinery behind the commitment.</text><path d="M74 540H856" stroke="#354552" stroke-width="1"/><text x="75" y="586" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#f5f4ee" letter-spacing="1.5">LOCAL ANALYSIS</text><text x="326" y="586" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#f5f4ee" letter-spacing="1.5">TRACEABLE EVIDENCE</text><text x="644" y="586" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#f5f4ee" letter-spacing="1.5">PRACTICAL NEXT STEPS</text><text x="75" y="641" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#aebfc7" >A framework + toolkit for AI governance review</text><rect x="1010" y="99" width="480" height="476" rx="16" fill="#192b39" stroke="#354552"/><rect x="978" y="132" width="480" height="476" rx="16" fill="#f5f4ee"/><text x="1017" y="185" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#5c6e76" letter-spacing="1.6">THE POLICY PROMISE</text><text x="1017" y="241" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#101f2d" >“We will monitor</text><text x="1017" y="284" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#101f2d" >the system.”</text><path d="M1017 320H1418" stroke="#d5dcd9" stroke-width="1"/><text x="1017" y="363" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#5c6e76" letter-spacing="1.5">THE REVIEW QUESTIONS</text><rect x="1017" y="389" width="34" height="34" rx="6" fill="#deeee6"/><text x="1023" y="413" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#205c4a" >01</text><text x="1066" y="413" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#101f2d" >What triggers action?</text><rect x="1017" y="442" width="34" height="34" rx="6" fill="#deeee6"/><text x="1023" y="466" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#205c4a" >02</text><text x="1066" y="466" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#101f2d" >Who must respond?</text><rect x="1017" y="495" width="34" height="34" rx="6" fill="#deeee6"/><text x="1023" y="519" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#205c4a" >03</text><text x="1066" y="519" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#101f2d" >What evidence is kept?</text><text x="1017" y="574" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#5c6e76" >From stated intent to inspectable control.</text></svg>